name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build must precede typecheck: Next generates the typed-route helpers
      # (LayoutProps, PageProps) into .next/types during the build, and
      # `tsc --noEmit` cannot resolve them until they exist.
      - run: npm run build
      - run: npm run typecheck
      # The isolation gate (docs/START-HERE.md phase 1) runs against the
      # real dev Supabase project — acceptable pre-launch, no real data yet.
      - run: npm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
