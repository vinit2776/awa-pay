name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build must precede typecheck: Next generates the typed-route helpers
      # (LayoutProps, PageProps) into .next/types during the build, and
      # `tsc --noEmit` cannot resolve them until they exist. Build also
      # needs real env vars now: collecting page data executes the (app)
      # layout's module graph (src/db/runtime.ts, src/auth/env.ts), which
      # throws on an unset var rather than deferring the check to request
      # time — acceptable pre-launch, dev-project credentials only.
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      - run: npm run typecheck
      # The isolation gate (docs/START-HERE.md phase 1), the auth gate
      # (phase 2), and the capture gate (phase 3) run against the real dev
      # Supabase project and real R2 bucket — acceptable pre-launch, no
      # real data yet.
      - run: npm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
